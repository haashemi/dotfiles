# fuzzel — Material You (M3 Expressive) dark, seed #7fbbea (Aurora primary)
# Docs: man 5 fuzzel.ini — token mapping lives in .agents/docs/fuzzel.md

[main]
# Material Symbols as fallback so the prompt glyph (U+E8B6 "search") renders.
font=Inter:size=12,Material Symbols Rounded:size=14
dpi-aware=auto
use-bold=yes
prompt="  "
placeholder=Search apps
icon-theme=breeze-dark
icons-enabled=yes
terminal=alacritty -e
match-counter=yes
show-actions=no
layer=overlay
anchor=center

width=36
lines=8
horizontal-pad=24
vertical-pad=24
inner-pad=16
line-height=40px
letter-spacing=0
image-size-ratio=0
gamma-correct-blending=yes

[colors]
# surface-container @ 85%
background=1d2024d9
text=e0e2e8ff
message=c2c7cfff
prompt=9ccbfbff
placeholder=8c9199ff
input=e0e2e8ff
match=9ccbfbff
selection=0f4a73ff
selection-text=cfe5ffff
selection-match=9ccbfbff
counter=8c9199ff
border=43474eff

[border]
# M3 extra-large shape for the sheet, full-pill for the active item.
width=0
radius=28
selection-radius=20
